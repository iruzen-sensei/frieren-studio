          # Delete this one-time workflow from the repo after it applies the update.
          rm -f .github/workflows/apply-frieren-cinematic-podcast-update.yml

      - name: Commit and push update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/cinematic-podcast-editing-style.mp4 public/cinematic-podcast-poster.jpg .github/workflows/apply-frieren-cinematic-podcast-update.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add cinematic podcast work card video"
          git pull --rebase origin main
          git push origin HEAD:main
