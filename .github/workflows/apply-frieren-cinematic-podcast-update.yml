name: Apply Frieren cinematic podcast update

on:
  push:
    paths:
      - '.github/workflows/apply-frieren-cinematic-podcast-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Create 5 second podcast video and update Work card
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public

          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          ffmpeg -hide_banner -y \
            -i "alex hormozi final clip.mp4" \
            -t 5 -an \
            -vf "scale=960:-2" \
            -c:v libx264 -preset medium -crf 24 -pix_fmt yuv420p \
            -movflags +faststart \
            "public/cinematic-podcast-editing-style.mp4"

          ffmpeg -hide_banner -y \
            -ss 0.1 \
            -i "public/cinematic-podcast-editing-style.mp4" \
            -frames:v 1 -q:v 3 -update 1 \
            "public/cinematic-podcast-poster.jpg"

          python3 - <<'PY'
          from pathlib import Path
          path = Path('public/index.html')
          html = path.read_text()
          start_marker = '      <div class="work-card" id="wc5"'
          end_marker = '      <div class="work-card" id="wc6"'
          start = html.index(start_marker)
          end = html.index(end_marker, start)
          new_card = '      <div class="work-card" id="wc5"><a href="#"><div class="thumb" style="background:#000"><video src="cinematic-podcast-editing-style.mp4" muted loop playsinline preload="none" poster="cinematic-podcast-poster.jpg" data-lazy-video style="width:100%;height:100%;object-fit:cover;display:block"></video><div class="style-label"><p class="style-name">Cinematic Podcast Editing Style</p><p class="style-desc">High-retention podcast cuts with cinematic pacing</p></div></div><div class="meta"><div class="row1"><div class="left"><p class="name">Cinematic Podcast Editing Style</p></div></div></div></a></div>\n'
          path.write_text(html[:start] + new_card + html[end:])
          PY

          # This was a one-time helper. Remove it after applying the update.
          rm -f .github/workflows/apply-frieren-cinematic-podcast-update.yml

      - name: Commit and push update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/cinematic-podcast-editing-style.mp4 public/cinematic-podcast-poster.jpg .github/workflows/apply-frieren-cinematic-podcast-update.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add cinematic podcast work card video"
          git pull --rebase origin main
          git push origin HEAD:main
