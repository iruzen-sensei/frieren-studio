name: Apply Frieren listen carousel update

on:
  push:
    paths:
      - '.github/workflows/apply-frieren-listen-carousel-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Apply listen carousel update
        shell: bash
        run: |
          set -euo pipefail
          cp "alex hormozi final clip.mp4" "public/alex-hormozi-final-clip.mp4"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          html=p.read_text()
          css_block=".listen-left{display:flex;flex-direction:column;gap:1.5rem;justify-content:center}\n.listen-title{font-family:'Thunder',sans-serif;font-weight:900;font-size:clamp(4rem,9vw,9rem);color:#171717;letter-spacing:-.01em;word-spacing:.18em;line-height:.85;text-transform:uppercase}\n.listen-note{font-family:'Helvetica Now Display','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:clamp(15px,1.4vw,22px);line-height:1.6;color:#000;font-weight:500;max-width:46ch;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;transition:opacity .28s ease,transform .28s cubic-bezier(.16,1,.3,1)}\n.listen-note.switching{opacity:0;transform:translateY(10px)}\n.listen-right{width:100%;overflow:hidden;padding:0 .25rem}\n.listen-carousel{position:relative;width:100%;padding:0 clamp(20px,4vw,56px);isolation:isolate}\n.listen-vid{position:relative;width:100%;aspect-ratio:16/9;border-radius:.75rem;overflow:hidden;background:#000;z-index:3;box-shadow:0 24px 70px rgba(0,0,0,.18);transition:transform .55s cubic-bezier(.16,1,.3,1)}\n.listen-carousel.sliding-next .listen-vid{transform:translateX(-2%) scale(.985)}\n.listen-carousel.sliding-prev .listen-vid{transform:translateX(2%) scale(.985)}\n.listen-vid video{transition:opacity .28s ease,transform .5s cubic-bezier(.16,1,.3,1)}\n.listen-vid.switching video{opacity:0;transform:scale(.985)}\n@media(min-width:1024px){.listen-vid{border-radius:1rem}}\n.listen-peek{position:absolute;top:50%;width:28%;aspect-ratio:16/9;border-radius:.75rem;overflow:hidden;background:#000;z-index:1;opacity:.55;filter:brightness(.58) saturate(.85);box-shadow:0 18px 50px rgba(0,0,0,.22);transition:transform .55s cubic-bezier(.16,1,.3,1),opacity .35s ease,filter .35s ease}\n.listen-peek img{width:100%;height:100%;object-fit:cover;display:block}\n.listen-peek::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.22);pointer-events:none}\n.listen-peek-prev{left:0;transform:translate(-18%,-50%) scale(.86)}\n.listen-peek-next{right:0;transform:translate(18%,-50%) scale(.86)}\n.listen-carousel.sliding-prev .listen-peek-prev,.listen-carousel.sliding-next .listen-peek-next{opacity:.85;filter:brightness(.8) saturate(1);transform:translate(0,-50%) scale(.94)}\n.listen-arrow{position:absolute;top:50%;z-index:15;width:44px;height:44px;border-radius:999px;background:rgba(23,23,23,.52);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#f5f5f5;transform:translateY(-50%);cursor:pointer;transition:background .3s,transform .3s,opacity .3s}\n.listen-arrow:hover{background:rgba(23,23,23,.72);transform:translateY(-50%) scale(1.06)}\n.listen-arrow svg{width:20px;height:20px;color:#f5f5f5}\n.listen-arrow-prev{left:1rem}.listen-arrow-next{right:1rem}\n.vol-pill{position:absolute;bottom:1rem;left:1rem;width:42%;z-index:10;display:flex;align-items:center;background:rgba(23,23,23,.52);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:.55rem 1rem}\n.vol-slider{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:rgba(245,245,245,.55);outline:none;cursor:pointer}\n.vol-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:#f5f5f5;box-shadow:0 1px 4px rgba(0,0,0,.45);cursor:pointer}\n.vol-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#f5f5f5;border:none;box-shadow:0 1px 4px rgba(0,0,0,.45);cursor:pointer}\n.audio-btn{position:absolute;bottom:1rem;right:1rem;z-index:10;display:flex;align-items:center;gap:.5rem;padding:.5rem 1rem;border-radius:999px;background:rgba(23,23,23,.52);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:background .3s}\n.audio-btn:hover{background:rgba(23,23,23,.7)}\n.audio-btn svg{width:17px;height:17px;color:#f5f5f5;flex-shrink:0}\n.audio-btn .click-me{color:#f5f5f5;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}\n.audio-btn .ico-on{display:none}\n.audio-btn.on .ico-on{display:block}\n.audio-btn.on .ico-off{display:none}\n@media(max-width:640px){.listen-right{padding:0}.listen-carousel{padding:0 26px}.listen-peek{width:38%;opacity:.42}.listen-peek-prev{left:-4px;transform:translate(-28%,-50%) scale(.82)}.listen-peek-next{right:-4px;transform:translate(28%,-50%) scale(.82)}.listen-arrow{width:38px;height:38px}.listen-arrow-prev{left:.55rem}.listen-arrow-next{right:.55rem}.vol-pill{width:38%;padding:.5rem .75rem}.audio-btn{padding:.5rem .75rem}.audio-btn .click-me{display:none}}"
          listen_block="      <div class=\"listen-left\">\n        <h2 class=\"listen-title\">Listen to<br>our work</h2>\n        <p class=\"listen-note\" id=\"listenNote\" aria-live=\"polite\">we tried to put strong emphasis on this part of the podcast and grab the viewers attention and create a sense of awe with fast paced cuts and text animations, we would also love for you to comment your opinions</p>\n      </div>\n      <div class=\"listen-right\">\n        <div class=\"listen-carousel\" id=\"listenCarousel\">\n          <div class=\"listen-peek listen-peek-prev\" id=\"listenPeekPrev\" aria-hidden=\"true\"><img src=\"listen-poster.jpg\" alt=\"\" loading=\"lazy\" decoding=\"async\"></div>\n          <div class=\"listen-vid\" id=\"listenStage\" style=\"background:#000\">\n            <video id=\"listenVideo\" src=\"alex-hormozi-final-clip.mp4\" muted loop playsinline preload=\"metadata\" poster=\"cinematic-podcast-poster.jpg\" style=\"width:100%;height:100%;object-fit:cover;display:block\"></video>\n            <button class=\"listen-arrow listen-arrow-prev\" id=\"listenPrev\" aria-label=\"Previous listen video\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"m15 18-6-6 6-6\"/></svg></button>\n            <button class=\"listen-arrow listen-arrow-next\" id=\"listenNext\" aria-label=\"Next listen video\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"m9 18 6-6-6-6\"/></svg></button>\n            <div class=\"vol-pill\">\n              <input type=\"range\" id=\"volSlider\" class=\"vol-slider\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0\" aria-label=\"Volume\">\n            </div>\n            <button class=\"audio-btn\" id=\"audioBtn\" aria-label=\"Toggle audio\">\n              <svg class=\"ico-on\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z\"/><path d=\"M16 9a5 5 0 0 1 0 6\"/><path d=\"M19.364 18.364a9 9 0 0 0 0-12.728\"/></svg>\n              <svg class=\"ico-off\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z\"/><line x1=\"22\" x2=\"16\" y1=\"9\" y2=\"15\"/><line x1=\"16\" x2=\"22\" y1=\"9\" y2=\"15\"/></svg>\n              <span class=\"click-me\">Click me</span>\n            </button>\n          </div>\n          <div class=\"listen-peek listen-peek-next\" id=\"listenPeekNext\" aria-hidden=\"true\"><img src=\"listen-poster.jpg\" alt=\"\" loading=\"lazy\" decoding=\"async\"></div>\n        </div>\n      </div>\n"
          js_block="// Listen video carousel: peeking side previews, smooth switching, synced descriptions\n(function(){\nconst v=document.getElementById('listenVideo'),b=document.getElementById('audioBtn'),s=document.getElementById('volSlider'),note=document.getElementById('listenNote'),stage=document.getElementById('listenStage'),carousel=document.getElementById('listenCarousel'),prev=document.getElementById('listenPrev'),next=document.getElementById('listenNext'),peekPrev=document.querySelector('#listenPeekPrev img'),peekNext=document.querySelector('#listenPeekNext img');if(!v)return;\nconst items=[\n{video:'alex-hormozi-final-clip.mp4',poster:'cinematic-podcast-poster.jpg',description:'we tried to put strong emphasis on this part of the podcast and grab the viewers attention and create a sense of awe with fast paced cuts and text animations, we would also love for you to comment your opinions'},\n{video:'project%20for%20base44.mp4',poster:'listen-poster.jpg',description:'This project was inspired by base44, a seriously well crafted motion design video aimed to convey the seamless workflow base44 provides for turning your wildest dreams into proper functioning deployment ready apps.'}\n];\nlet current=0,visible=false,audioOn=false,sliderVal=0.3,fadeRaf=null,switchTimer=null,switching=false;v.volume=0;v.muted=true;\nfunction updatePeeks(){if(items.length<2)return;const pi=(current-1+items.length)%items.length,ni=(current+1)%items.length;if(peekPrev)peekPrev.src=items[pi].poster;if(peekNext)peekNext.src=items[ni].poster}\nfunction fadeTo(target,dur,done){cancelAnimationFrame(fadeRaf);if(target>0)v.muted=false;const start=v.volume,t0=performance.now();function step(now){const p=Math.min(1,(now-t0)/dur);v.volume=start+(target-start)*p;if(p>=1){if(target===0)v.muted=true;if(done)done()}else{fadeRaf=requestAnimationFrame(step)}}fadeRaf=requestAnimationFrame(step)}\nfunction setNote(text,instant){if(!note)return;if(instant){note.textContent=text;return}note.classList.add('switching');setTimeout(function(){note.textContent=text;note.classList.remove('switching')},180)}\nfunction playIfVisible(){if(visible){v.play().catch(function(){});fadeTo(audioOn?sliderVal:0,320)}else{fadeTo(0,320,function(){v.pause()})}}\nfunction switchTo(i,dir){if(switching||items.length<2)return;const target=(i+items.length)%items.length;if(target===current)return;switching=true;const item=items[target],direction=dir||'next';clearTimeout(switchTimer);setNote(item.description,false);if(stage)stage.classList.add('switching');if(carousel)carousel.classList.add('sliding-'+direction);fadeTo(0,180,function(){v.pause();v.src=item.video;v.poster=item.poster;v.load();let done=false;function ready(){if(done)return;done=true;current=target;switching=false;clearTimeout(switchTimer);updatePeeks();if(stage)stage.classList.remove('switching');if(carousel)carousel.classList.remove('sliding-next','sliding-prev');playIfVisible()}v.addEventListener('canplay',ready,{once:true});switchTimer=setTimeout(ready,700)})}\nif(prev)prev.addEventListener('click',function(){switchTo(current-1,'prev')});if(next)next.addEventListener('click',function(){switchTo(current+1,'next')});\nif(b){b.addEventListener('click',function(){cancelAnimationFrame(fadeRaf);if(audioOn){audioOn=false;v.muted=true}else{audioOn=true;sliderVal=0.3;if(s)s.value=0.3;v.muted=false;v.volume=0.3}b.classList.toggle('on',audioOn);if(audioOn&&visible&&v.paused)v.play().catch(function(){})})}\nif(s){s.addEventListener('input',function(){cancelAnimationFrame(fadeRaf);sliderVal=parseFloat(s.value);v.volume=sliderVal;v.muted=(sliderVal===0);audioOn=(sliderVal>0);if(b)b.classList.toggle('on',audioOn)})}\nupdatePeeks();if(typeof IntersectionObserver!='undefined'){new IntersectionObserver(function(e){e.forEach(function(en){visible=en.isIntersecting;playIfVisible()})},{rootMargin:'200px'}).observe(v)}else{visible=true;playIfVisible()}\n})();"
          css_start=html.index('.listen-left{display:flex')
          css_end=html.index('\n\n/* SERVICES */', css_start)
          html=html[:css_start]+css_block+html[css_end:]
          html_start=html.index('      <div class="listen-left">')
          html_end=html.index('    </div>\n  </section></div>', html_start)
          html=html[:html_start]+listen_block+html[html_end:]
          js_start=html.index('// Listen video')
          js_end=html.index('\n\nif(window.__frierenBoot)', js_start)
          html=html[:js_start]+js_block+html[js_end:]
          p.write_text(html)
          PY
          rm -f .github/workflows/apply-frieren-listen-carousel-update.yml

      - name: Commit and push update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/alex-hormozi-final-clip.mp4 .github/workflows/apply-frieren-listen-carousel-update.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add listen section peeking video carousel"
          git pull --rebase origin main
          git push origin HEAD:main
