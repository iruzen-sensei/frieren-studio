name: Add SaaS product launch work card

on:
  push:
    paths:
      - '.github/workflows/apply-frieren-saas-work-card-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Create Base44 clip and update 6th Work card
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public

          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          ffmpeg -hide_banner -y \
            -i "public/project for base44.mp4" \
            -ss 00:00:06 -t 8 -an \
            -vf "scale=960:-2" \
            -c:v libx264 -preset medium -crf 24 -pix_fmt yuv420p \
            -movflags +faststart \
            "public/saas-product-launch-base44.mp4"

          ffmpeg -hide_banner -y \
            -ss 00:00:01 \
            -i "public/saas-product-launch-base44.mp4" \
            -frames:v 1 -q:v 3 -update 1 \
            "public/saas-product-launch-poster.jpg"

          python3 - <<'PY'
          from pathlib import Path
          path = Path('public/index.html')
          html = path.read_text()

          html = html.replace(
              '<p class="work-sub">In different styles we specialize in</p>',
              '<p class="work-sub">Demo show clips from our multiple projects</p>'
          )

          start_marker = '      <div class="work-card" id="wc6"'
          end_marker = '    </div>\n  </section>'
          start = html.index(start_marker)
          end = html.index(end_marker, start)
          new_card = '      <div class="work-card" id="wc6"><a href="#"><div class="thumb" style="background:#000"><video src="saas-product-launch-base44.mp4" muted loop playsinline preload="none" poster="saas-product-launch-poster.jpg" data-lazy-video style="width:100%;height:100%;object-fit:cover;display:block"></video><div class="style-label"><p class="style-name">Saas Product Launch</p><p class="style-desc">Saas product launch</p></div></div><div class="meta"><div class="row1"><div class="left"><p class="name">Saas Product Launch</p></div></div></div></a></div>\n'
          html = html[:start] + new_card + html[end:]

          path.write_text(html)
          PY

          rm -f .github/workflows/apply-frieren-saas-work-card-update.yml

      - name: Commit and push update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/saas-product-launch-base44.mp4 public/saas-product-launch-poster.jpg .github/workflows/apply-frieren-saas-work-card-update.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add SaaS product launch work card"
          git pull --rebase origin main
          git push origin HEAD:main
